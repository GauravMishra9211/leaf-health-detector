
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1b5e20">

    <title>{% block pagetitle %}{% endblock pagetitle %}</title>

    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(to bottom right, #edf7ed, #dff3df);
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background: rgba(7, 60, 18, 0.95);
            backdrop-filter: blur(10px);
            padding: 14px 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .navbar-brand {
            font-size: 24px;
            font-weight: 700;
            color: white !important;
        }

        .nav-link {
            color: rgba(255,255,255,0.85) !important;
            margin-left: 15px;
            font-weight: 500;
            transition: 0.3s ease;
        }

        .nav-link:hover {
            color: #ffffff !important;
            transform: translateY(-2px);
        }

        .main-content {
            flex: 1;
            padding-top: 30px;
        }

        .footer {
            background: #072e12;
            color: white;
            padding: 40px 20px 20px;
            margin-top: 60px;
        }

        .footer .social-icons a {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
            margin: 0 8px;
            color: white;
            font-size: 20px;
            transition: 0.3s ease;
            text-decoration: none;
        }

        .footer .social-icons a:hover {
            transform: translateY(-5px);
            background: rgba(255,255,255,0.15);
        }

        .footer-links {
            margin-top: 25px;
        }

        .footer-links a {
            color: rgba(255,255,255,0.8);
            margin: 0 12px;
            text-decoration: none;
            transition: 0.3s ease;
        }

        .footer-links a:hover {
            color: white;
        }

        .footer-text {
            margin-top: 25px;
            color: rgba(255,255,255,0.65);
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .navbar-brand {
                font-size: 20px;
            }

            .nav-link {
                margin-left: 0;
                margin-top: 10px;
            }

            .footer-links a {
                display: inline-block;
                margin: 8px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">🌿 AgriVision AI</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/index">AI Engine</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/market">Supplements</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/contact">Contact</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="main-content">
        {% block body %}
        {% endblock body %}
    </div>

    <footer class="footer text-center">
        <div class="social-icons mb-4">
            <a href="mailto:mishragaurav6825@gmail.com"><i class="fas fa-envelope"></i></a>
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-linkedin"></i></a>
            <a href="#"><i class="fab fa-github"></i></a>
        </div>

        <div class="footer-links">
            <a href="/">Home</a>
            <a href="/index">AI Engine</a>
            <a href="/market">Supplements</a>
            <a href="/contact">Contact</a>
        </div>

        <div class="footer-text">
            Developed by Gaurav Mishra | GL Bajaj Institute of Technology and Management
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/static/sw.js')
                    .then(reg => console.log('Service Worker registered:', reg))
                    .catch(err => console.log('Service Worker registration failed:', err));
            });
        }
    </script>

</body>
</html>
```
